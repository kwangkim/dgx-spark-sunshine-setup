[Service]
# Set X11 display (change if your display is not :0)
Environment="DISPLAY=:0"

# XAUTHORITY Setup (REQUIRED for Sunshine to capture the screen)
# ---------------------------------------------------------------
# Sunshine needs XAUTHORITY to authenticate with the X server.
# Without it, the service runs but captures a black screen.
#
# SETUP (run once after first GUI login, from desktop terminal or SSH with DISPLAY=:0):
#   dbus-update-activation-environment --systemd DISPLAY XAUTHORITY
#
# AUTOMATE (add to ~/.xprofile so it runs on every login):
#   echo 'dbus-update-activation-environment --systemd DISPLAY XAUTHORITY' >> ~/.xprofile
#
# VERIFY:
#   systemctl --user show-environment | grep XAUTHORITY
#   Expected: XAUTHORITY=/home/<user>/.Xauthority (or /run/user/<uid>/...)
