[Unit]
# Ensure graphical session is available before starting
Wants=graphical-session.target
After=graphical-session.target

[Service]
Environment="DISPLAY=:0"
# Do not hardcode XAUTHORITY here.
# Instead, ensure your X session exports XAUTHORITY into the user systemd manager:
#   dbus-update-activation-environment --systemd DISPLAY XAUTHORITY
# Verify:
#   systemctl --user show-environment | grep XAUTHORITY
# Auto-restart on failure for reliability
Restart=on-failure
RestartSec=5
